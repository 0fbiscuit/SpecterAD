# Edge Weight Configuration for Mini BloodHound
#
# Each edge type has three risk dimensions:
#   detection:  0.0 (silent/undetectable) → 1.0 (very noisy, triggers alerts)
#   failure:    0.0 (always works) → 1.0 (likely to fail or require conditions)
#   complexity: 0.0 (trivial, script-kiddie) → 1.0 (expert-level, multi-step)
#
# Lower composite weight = more attractive attack path.
# Dijkstra finds the "quietest" path by minimizing total composite weight.

weights:
  # ── ACL / Permission-based (generally quiet) ──
  GenericAll:           {detection: 0.1, failure: 0.05, complexity: 0.2}
  GenericWrite:         {detection: 0.15, failure: 0.05, complexity: 0.2}
  WriteDacl:            {detection: 0.2, failure: 0.05, complexity: 0.3}
  WriteOwner:           {detection: 0.2, failure: 0.05, complexity: 0.3}
