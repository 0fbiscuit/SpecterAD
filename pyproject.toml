[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specterad"
version = "1.0.2"
description = "SpecterAD -- In-Memory AD Attack Path Analyzer. Developed by biscuit."
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "biscuit"}]

dependencies = [
    "networkx>=3.3",
    "rich>=13.0",
    "orjson>=3.10",
    "ijson>=3.2",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
specterad = "specterad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
